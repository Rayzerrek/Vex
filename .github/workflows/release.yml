name: Native packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      mode:
        description: Preview creates Actions artifacts only; release publishes an existing version tag
        type: choice
        options: [preview, release]
        default: preview
      tag:
        description: Existing vX.Y.Z tag (release mode only)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: native-package-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve exact source and version
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      version: ${{ steps.source.outputs.version }}
      label: ${{ steps.source.outputs.label }}
      tag: ${{ steps.source.outputs.tag }}
      mode: ${{ steps.source.outputs.mode }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Validate source
        id: source
        shell: bash
        env:
          MODE: ${{ github.event_name == 'push' && 'release' || inputs.mode }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag=''
          label=''
          if [[ "$MODE" == release ]]; then
            [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo 'Expected vX.Y.Z tag'; exit 1; }
            tag="$RELEASE_TAG"
            commit="$(git rev-parse --verify "refs/tags/$tag^{commit}")"
          elif [[ "$MODE" == preview ]]; then
            commit="$GITHUB_SHA"
            label="preview-${commit:0:12}"
          else
            echo 'Unknown package mode'; exit 1
          fi
          git checkout --detach "$commit"
          version="$(python3 -c 'import sys; sys.path.insert(0, "app/tools"); import package; print(package.release_version())')"
          if [[ "$MODE" == release && "$tag" != "v$version" ]]; then
            echo "Tag $tag does not match app/VERSION ($version)"; exit 1
          fi
          printf 'commit=%s\nversion=%s\nlabel=%s\ntag=%s\nmode=%s\n' "$commit" "$version" "$label" "$tag" "$MODE" >> "$GITHUB_OUTPUT"

  checks:
    name: Native build and tests
    needs: resolve
    uses: ./.github/workflows/native.yml
    with:
      ref: ${{ needs.resolve.outputs.commit }}

  package:
    name: ZIP and MSI from tested binaries
    needs: [resolve, checks]
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.commit }}
      - uses: actions/download-artifact@v8
        with:
          name: native-win-x64-ReleaseSafe
          path: app/zig-out/bin
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # .NET is a WiX/MSI build tool only; neither the application nor its tests use WPF/.NET.
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Package and verify MSI extraction
        shell: pwsh
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          LABEL: ${{ needs.resolve.outputs.label }}
        run: |
          ./app/tools/build-installer.ps1 -Version $env:VERSION -Label $env:LABEL -SkipBuild -SkipTests
      - name: Record source provenance
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ needs.resolve.outputs.commit }}
          PACKAGE_MODE: ${{ needs.resolve.outputs.mode }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          @{
            commit = $env:SOURCE_COMMIT
            ref = $env:GITHUB_REF
            version = $env:VERSION
            mode = $env:PACKAGE_MODE
            run = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          } | ConvertTo-Json | Set-Content app/publish/build-info.json -Encoding utf8
          "### Native $env:PACKAGE_MODE package — $env:SOURCE_COMMIT" >> $env:GITHUB_STEP_SUMMARY
          "ZIP, MSI and both SHA-256 files are available in the workflow artifacts." >> $env:GITHUB_STEP_SUMMARY
          if ($env:PACKAGE_MODE -eq 'preview') {
            "No tag, GitHub Release or main-branch change was made. Preview MSI uses the same install location as stable; test on an isolated machine." >> $env:GITHUB_STEP_SUMMARY
          }
      - uses: actions/upload-artifact@v7
        with:
          name: vex-native-${{ needs.resolve.outputs.label || needs.resolve.outputs.version }}
          path: |
            app/publish/*.zip
            app/publish/*.msi
            app/publish/*.sha256
            app/publish/build-info.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: native-packaging-diagnostics
          path: app/publish/*.log
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish stable GitHub Release
    if: needs.resolve.outputs.mode == 'release'
    needs: [resolve, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vex-native-${{ needs.resolve.outputs.version }}
          path: publish
      - name: Upload verified artifacts and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          base="publish/Vex-Native-$VERSION-win-x64"
          assets=("$base.zip" "$base.zip.sha256" "$base.msi" "$base.msi.sha256")
          for asset in "${assets[@]}"; do test -f "$asset"; done
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --draft --title "Vex Native $VERSION" --generate-notes
          fi
          gh release upload "$TAG" "${assets[@]}" --clobber
          gh release edit "$TAG" --draft=false

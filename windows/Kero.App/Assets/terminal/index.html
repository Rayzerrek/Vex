<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="xterm.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  #term { height: 100%; padding: 2px 0 0 6px; box-sizing: border-box; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #3D4354; border-radius: 5px; border: 2px solid #1F1F24; }
  ::-webkit-scrollbar-thumb:hover { background: #5a6075; }
  ::-webkit-scrollbar-corner { background: transparent; }
</style>
</head>
<body>
<div id="term"></div>
<script src="xterm.js"></script>
<script src="addon-fit.js"></script>
<script src="xterm-addon-webgl.js"></script>
<script>
(function () {
  var send = function (msg) { window.chrome.webview.postMessage(msg); };
  var toBase64 = function (str) {
    return btoa(unescape(encodeURIComponent(str)));
  };

  var term = new Terminal({
    allowTransparency: true,
    fontFamily: "'Cascadia Mono', 'Cascadia Code', Consolas, monospace",
    fontSize: 14,
    cursorBlink: true,
    scrollback: 5000,
    theme: {
      background: '#1F1F24',
      foreground: '#E4E4E7',
      cursor: '#E4E4E7',
      selectionBackground: '#3D4354'
    }
  });
  var fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(document.getElementById('term'));

  try {
    var webgl = new WebglAddon.WebglAddon();
    // WebGL addon can sometimes fail depending on the system/browser
    webgl.onContextLoss(function(e) { webgl.dispose(); });
    term.loadAddon(webgl);
  } catch (e) {
    console.error("WebGL failed to load, falling back to DOM renderer", e);
  }

  // Workspace shortcuts. Keystrokes live inside the WebView2, so they are
  // captured here (before xterm sees them) and forwarded to the app.
  window.addEventListener('keydown', function (e) {
    if (e.ctrlKey && e.shiftKey && !e.altKey) {
      var command = { ArrowRight: 'splitRight', ArrowDown: 'splitDown', KeyT: 'newTab', KeyW: 'closePane' }[e.code];
      if (command) {
        e.preventDefault();
        e.stopPropagation();
        send({ type: 'command', name: command });
      }
    }
  }, true);

  term.onData(function (d) { send({ type: 'input', data: toBase64(d) }); });
  term.onBinary(function (d) {
    var bytes = new Uint8Array(d.length);
    for (var i = 0; i < d.length; i++) bytes[i] = d.charCodeAt(i) & 255;
    var bin = '';
    bytes.forEach(function (b) { bin += String.fromCharCode(b); });
    send({ type: 'input', data: btoa(bin) });
  });
  term.onTitleChange(function (t) { send({ type: 'title', title: t }); });
  term.onResize(function (size) { send({ type: 'resize', cols: size.cols, rows: size.rows }); });

  var reportSize = function () {
    fit.fit();
    send({ type: 'size', cols: term.cols, rows: term.rows });
  };
  window.addEventListener('resize', reportSize);

  window.chrome.webview.addEventListener('message', function (e) {
    var m = e.data;
    if (m.type === 'output') {
      var bin = atob(m.data);
      var bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      term.write(bytes);
    } else if (m.type === 'theme') {
      term.options.theme = m.theme;
      term.options.fontFamily = m.fontFamily;
      term.options.fontSize = m.fontSize;
      term.options.cursorBlink = m.cursorBlink;
      fit.fit();
    }
  });

  send({ type: 'ready' });
  reportSize();
})();
</script>
</body>
</html>
